<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteCast - Light & Smooth Podcast Player</title>
  <meta name="description" content="Light and smooth podcast player to consume all of your freshest podcasts.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #02335E;
      --blue: #0B518D;
      --gold: #E6A91A;
      --ice: #96C4E3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #fff;
    }

    /*
     * Layers rebuilt from Splash.svg (1512 x 822 artboard):
     * hero photo on the left, a navy panel fading in from x 466 -> 652,
     * then the water-droplet texture fading in from x 619 -> 1024.
     */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .hero {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45.6%;
      background: url("hero.png") center top / cover no-repeat;
    }

    .navy {
      position: absolute;
      inset: 0;
      background: var(--navy);
      -webkit-mask-image: linear-gradient(85deg, transparent 30.8%, #000 43.1%);
              mask-image: linear-gradient(85deg, transparent 30.8%, #000 43.1%);
    }

    .water {
      position: absolute;
      top: -3%;
      left: 29.6%;
      width: 110.2%;
      height: 110%;
      background: url("water.png") 0 0 / 100% 100% no-repeat;
      -webkit-mask-image: linear-gradient(77deg, transparent 10.3%, #000 34.7%);
              mask-image: linear-gradient(77deg, transparent 10.3%, #000 34.7%);
    }

    /* Logo + downloads, centred on the logo's position in the mockup (x ~ 70.5%) */
    .content {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 70.5%;
      transform: translateX(-50%);
      width: min(720px, 56vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vh, 20px);
      padding: 1vh 0 4.5vh;
    }

    .logo {
      display: block;
      height: min(72vh, 600px);
      width: auto;
      max-width: 100%;
      animation: drop-in 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
    }

    /* OS-style download badges */
    .downloads {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 12px;
      animation: fade-up 0.6s 0.45s ease-out both;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
      padding: 9px 18px 9px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .badge:hover,
    .badge:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
      outline: none;
    }

    .badge svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .badge-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .badge-text small {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.75);
    }

    .badge-text span {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .badge-web {
      background: var(--gold);
      border-color: rgba(255, 255, 255, 0.5);
      color: var(--navy);
    }

    .badge-web .badge-text small {
      color: rgba(2, 51, 94, 0.75);
    }

    .badge-web:hover,
    .badge-web:focus-visible {
      border-color: #fff;
    }

    .github-link {
      position: absolute;
      left: 70.5%;
      bottom: 2.2vh;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .github-link:hover { color: #fff; }

    .github-link svg { width: 18px; height: 18px; }

    @keyframes drop-in {
      from { opacity: 0; transform: translateY(-24px) rotate(-3deg) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .downloads { animation: none; }
    }

    /* Narrower desktops: badges go 2 x 2 */
    @media (max-width: 1280px) {
      .downloads { grid-template-columns: repeat(2, auto); }
      .logo { height: min(62vh, 560px); }
    }

    /* Phones / portrait: hero on top, navy + water below, page may scroll */
    @media (max-width: 820px), (orientation: portrait) {
      html, body { overflow: auto; height: auto; }

      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--navy);
      }

      .hero {
        position: relative;
        width: 100%;
        height: 46vh;
        flex-shrink: 0;
        background-position: center 20%;
        -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 100%);
                mask-image: linear-gradient(180deg, #000 60%, transparent 100%);
      }

      .navy { display: none; }

      .water {
        top: 30vh;
        left: 0;
        width: 100%;
        height: auto;
        bottom: 0;
        background-size: cover;
        background-position: center;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%);
                mask-image: linear-gradient(180deg, transparent 0%, #000 30%);
      }

      .content {
        position: relative;
        left: auto;
        transform: none;
        width: 100%;
        margin-top: -14vh;
        padding: 0 16px 24px;
        gap: 16px;
      }

      .logo { height: auto; width: min(62vw, 300px); }

      .downloads {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        max-width: 400px;
      }

      .badge { min-width: 0; }

      .github-link {
        position: relative;
        left: auto;
        bottom: auto;
        transform: none;
        align-self: center;
        margin: 0 0 24px;
      }
    }

    @media (max-width: 360px) {
      .downloads { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="hero" role="img" aria-label="A happy listener giving a thumbs up in a Cast Lite headset"></div>
    <div class="navy" aria-hidden="true"></div>
    <div class="water" aria-hidden="true"></div>

  </main>
</body>
</html>
