<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteCast - Light & Smooth Podcast Player</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --sky-400: #38bdf8;
      --sky-500: #0ea5e9;
      --sky-600: #0284c7;
      --gold-400: #facc15;
      --gold-500: #eab308;
      --gold-600: #ca8a04;
      --bg-blue: #e0f2fe;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-blue);
    }

    .container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* Left side - Hero Image */
    .hero-image {
      flex: 1;
      position: relative;
      display: none;
    }

    @media (min-width: 900px) {
      .hero-image {
        display: block;
      }
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Blue fade overlay on the right side of the image */
    .hero-image::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 250px;
      background: linear-gradient(to left, var(--bg-blue) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Right side - Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
      position: relative;
      background: linear-gradient(180deg, var(--bg-blue) 0%, #fef9c3 100%);
    }

    @media (min-width: 900px) {
      .content {
        padding: 2rem 3rem;
        align-items: flex-start;
        text-align: left;
        background: linear-gradient(135deg, var(--bg-blue) 0%, #f0f9ff 50%, #fef9c3 100%);
      }
    }

    /* Decorative elements */
    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.25;
      animation: float 6s ease-in-out infinite;
    }

    .bubble-1 {
      width: 80px;
      height: 80px;
      background: var(--sky-400);
      top: 10%;
      right: 10%;
    }

    .bubble-2 {
      width: 50px;
      height: 50px;
      background: var(--gold-400);
      top: 55%;
      right: 5%;
      animation-delay: 2s;
    }

    .bubble-3 {
      width: 60px;
      height: 60px;
      background: var(--sky-500);
      bottom: 20%;
      right: 18%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--gold-400);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: sparkle 2s ease-in-out infinite;
    }

    .sparkle-1 { top: 15%; right: 22%; }
    .sparkle-2 { top: 35%; right: 6%; animation-delay: 0.5s; transform: scale(0.7); }
    .sparkle-3 { bottom: 35%; right: 25%; animation-delay: 1s; transform: scale(0.85); }

    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
    }

    /* Main content wrapper */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    @media (min-width: 900px) {
      .main-content {
        align-items: flex-start;
      }
    }

    /* Mobile hero */
    .mobile-hero {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 4px solid white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      animation: logoIn 0.8s ease-out;
    }

    @media (min-width: 900px) {
      .mobile-hero {
        display: none;
      }
    }

    /* Logo */
    .logo {
      width: 300px;
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
      animation: logoIn 0.8s ease-out;
    }

    @media (min-width: 900px) {
      .logo {
        width: 380px;
        margin-bottom: 1.25rem;
      }
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: scale(0.8) rotate(-5deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Version badge */
    .version {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(14, 165, 233, 0.15);
      color: var(--sky-600);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      animation: slideUp 0.6s ease-out 0.2s both;
    }

    /* Tagline */
    .tagline {
      font-size: 1.1rem;
      color: #475569;
      margin-bottom: 1.5rem;
      max-width: 380px;
      line-height: 1.5;
      animation: slideUp 0.6s ease-out 0.3s both;
    }

    @media (min-width: 900px) {
      .tagline {
        font-size: 1.35rem;
        margin-bottom: 1.75rem;
      }
    }

    .tagline .highlight {
      color: var(--gold-600);
      font-weight: 600;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Download section */
    .download-section {
      animation: slideUp 0.6s ease-out 0.5s both;
    }

    .download-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }

    .download-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }

    @media (min-width: 900px) {
      .download-buttons {
        justify-content: flex-start;
      }
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .download-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-macos {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.3);
    }

    .btn-macos:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(30, 41, 59, 0.4);
    }

    .btn-windows {
      background: linear-gradient(135deg, var(--sky-500), var(--sky-600));
      color: white;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    .btn-windows:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.4);
    }

    .btn-android {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .btn-android:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
    }

    .btn-web {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
      color: #1e293b;
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
    }

    .btn-web:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(234, 179, 8, 0.4);
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      animation: slideUp 0.6s ease-out 0.7s both;
    }

    @media (min-width: 900px) {
      .footer {
        left: 3rem;
        transform: none;
        bottom: 1.5rem;
      }
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .github-link:hover {
      color: var(--sky-600);
    }

    .github-link svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left: Hero Image -->
    <div class="hero-image">
      <img src="hero.png" alt="CastLite Hero">
    </div>

    <!-- Right: Content -->
    <div class="content">
      <!-- Decorative elements -->
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>

      <!-- Main content -->
      <div class="main-content">
        <!-- Mobile hero (circular crop) -->
        <img src="hero.png" alt="CastLite" class="mobile-hero">

        <!-- Logo -->

        <!-- Version badge -->
        <span class="version">Coming Soon</span>

        <div class="download-section">

        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">

    </div>
  </div>
</body>
</html>
